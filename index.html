<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Isla Arcilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="scene"></div>
<div id="top">
  <div id="topRow"><div id="res" aria-label="Recursos"></div><div id="topBtns"><button id="menuBtn">Menú</button><div class="tbrow"><button id="diarioBtn" aria-label="Diario de la isla"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="4" y="3" width="15" height="18" rx="2" fill="#c98655"/><rect x="6" y="3" width="2" height="18" fill="#8a5a2e"/><rect x="10" y="7" width="7" height="2" fill="#fff0d0"/><rect x="10" y="11" width="5" height="2" fill="#fff0d0"/></svg><i id="diarioBadge" hidden></i></button><button id="clock" aria-label="Hora del día"></button></div></div></div>
  <div id="goal"><span class="n" id="goalN">1/8</span><span class="t" id="goalT"></span></div>
</div>
<div id="toast" aria-live="polite"></div>
<div id="fps" hidden></div>
<div id="bottom">
  <div id="crew"></div>
  <button class="bigbtn" id="buildBtn" aria-label="Construir"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="11" height="6" rx="1.5" fill="#6a4226"/><rect x="3" y="4" width="11" height="2.5" rx="1" fill="#8a5a2e"/><rect x="11" y="9" width="3" height="12" rx="1" fill="#8a5a2e" transform="rotate(-8 12 15)"/></svg>Construir</button>
</div>
<div id="placeHint" hidden>Toca una casilla para mover · amarillo = cabe</div>
<div id="placeBar" hidden><button id="pCancel">Cancelar</button><button id="pRot">Rotar</button><button id="pOk" class="ok">Colocar</button></div>
<div id="expandBar" hidden><span></span><div id="xKinds" class="seg" role="group" aria-label="Tipo de parcela"></div><button id="xExit">Listo</button></div>
<div id="sheet" hidden role="dialog"></div>
<div id="title">
  <div class="box">
    <h1>ISLA<br>ARCILLA</h1>
    <p class="sub">Guía a tus figuras de barro y despierta la isla.</p>
    <button class="btn main" id="tContinue">Continuar</button>
    <button class="btn" id="tNew">Nueva partida</button>
    <div class="ver">Versión 0.12 · se guarda en este navegador</div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
