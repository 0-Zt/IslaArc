<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>Isla Arcilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen diorama; resources + goal float at the top, crew + build button at the thumb zone, sheets slide up from the bottom. One deliberate dark-glass UI over a bright world. */
:root{
  --glass:#132330e6; --glass2:#1e3344; --line:#35506a; --text:#f5eedd; --muted:#a8bccb;
  --sun:#f2c14e; --sun-ink:#2a1a08; --good:#8fdc6a; --bad:#ff8a6a; --clay:#c98655;
  --display:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  --body:"Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#8fcdf2;color:var(--text);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}

#top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:4;pointer-events:none}
#topRow{display:flex;gap:6px;align-items:flex-start}
#res{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--glass);border:1.5px solid var(--line);border-radius:999px;padding:2px 9px 2px 3px;font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums;line-height:22px;transition:transform .15s,border-color .15s}
.chip img{width:22px;height:22px;image-rendering:pixelated}
.chip.bump{border-color:var(--sun);transform:scale(1.08)}
#menuBtn{pointer-events:auto;background:var(--glass);border:1.5px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;flex:none}
#goal{pointer-events:auto;display:flex;gap:10px;align-items:center;background:var(--glass);border:1.5px solid var(--line);border-radius:12px;padding:7px 12px 7px 8px;max-width:420px;align-self:flex-start;transition:border-color .3s}
#goal.flash{border-color:var(--good)}
#goal .n{font-family:var(--display);font-size:13px;background:var(--sun);color:var(--sun-ink);border-radius:8px;padding:2px 7px;flex:none}
#goal .t{font-size:14px;line-height:1.3}

#toast{position:fixed;top:calc(118px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:6;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--glass);border:1.5px solid var(--sun);border-radius:12px;padding:7px 14px;font-size:14px;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

#bottom{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;z-index:4}
#crew{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;padding-bottom:2px}
.wcard{display:flex;gap:8px;align-items:center;background:var(--glass);border:2px solid var(--line);border-radius:14px;padding:6px 10px 6px 6px;text-align:left;min-width:0;flex:none}
.wcard i{width:34px;height:34px;border-radius:50% 50% 44% 44%;flex:none;display:grid;place-items:center;font-family:var(--display);font-style:normal;font-size:16px;color:#2a1a10;box-shadow:inset -5px -6px 0 #0003,inset 4px 4px 0 #fff4}
.wcard b{display:block;font-family:var(--display);font-size:15px;font-weight:500}
.wcard span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;max-width:112px;overflow:hidden;text-overflow:ellipsis}
.wcard.sel{border-color:var(--sun);background:var(--glass2)}
.wcard.locked{opacity:.55}
.wcard.locked i{background:#3a4a58!important;color:var(--muted)}
.bigbtn{flex:none;width:72px;height:72px;border-radius:18px;background:var(--sun);color:var(--sun-ink);border:2px solid #b0822a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;box-shadow:0 4px 0 #0005}
.bigbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #0005}
.bigbtn svg{width:30px;height:30px}
.hint{animation:hint 1.2s ease-in-out infinite}
@keyframes hint{50%{box-shadow:0 0 0 5px #f2c14e88}}

#placeBar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5}
#placeBar button{flex:1;height:56px;border-radius:14px;background:var(--glass);border:2px solid var(--line);font-size:15px;font-weight:600}
#placeBar .ok{background:var(--sun);color:var(--sun-ink);border-color:#b0822a}
#placeBar .ok[disabled]{opacity:.45}
#placeHint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--glass);border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;z-index:5;white-space:nowrap}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-top:2px solid var(--line);border-radius:20px 20px 0 0;max-height:68%;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box;animation:up .22s ease-out;touch-action:pan-y}
@keyframes up{from{transform:translateY(30px);opacity:.3}}
#sheet .grab{width:44px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
#sheet h2{margin:0 0 2px;font-family:var(--display);font-size:24px;color:var(--sun);font-weight:700}
#sheet p{margin:4px 0 10px;font-size:14px;line-height:1.4;color:var(--muted);max-width:60ch}
#sheet .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:10px;background:var(--glass2);border:1.5px solid var(--line);font-size:18px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1.5px solid var(--glass2)}
.row .info{flex:1;min-width:0}
.row .info b{font-size:16px;font-weight:600}
.row .info small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
.thumb{width:52px;height:52px;border-radius:12px;background:var(--glass2);display:grid;place-items:center;flex:none}
.thumb svg{width:40px;height:40px}
.cost{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cost span{display:inline-flex;align-items:center;gap:3px;font-size:13px;background:var(--glass2);border-radius:8px;padding:1px 7px 1px 2px;font-variant-numeric:tabular-nums}
.cost span img{width:18px;height:18px;image-rendering:pixelated}
.cost span.no{color:var(--bad)}
.btn{background:var(--glass2);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;flex:none;min-height:44px}
.btn.main{background:var(--sun);color:var(--sun-ink);border-color:#b0822a}
.btn[disabled]{opacity:.45}
.done{color:var(--good);font-size:14px;font-weight:600}
.bar{height:8px;border-radius:8px;background:var(--glass2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--sun);border-radius:8px}
.float{position:fixed;z-index:3;pointer-events:none;font-family:var(--display);font-size:17px;color:#fff;text-shadow:0 2px 0 #0008;display:flex;align-items:center;gap:3px;animation:fl 1.1s ease-out forwards;transform:translate(-50%,-100%)}
.float img{width:18px;height:18px;image-rendering:pixelated}
@keyframes fl{to{transform:translate(-50%,-190%);opacity:0}}

#title{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:linear-gradient(#0d213166,#0d2131d8);padding-inline:16px}
#title .box{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;width:min(340px,100%)}
#title h1{font-family:var(--display);font-size:clamp(52px,15vw,84px);line-height:.88;margin:0;color:var(--sun);text-shadow:0 4px 0 #8a5a1a,0 9px 0 #0007;font-weight:700}
#title .sub{color:var(--text);font-size:15px;margin:0 0 14px;opacity:.9}
#title .btn{width:100%;font-size:17px;padding:13px}
#title .ver{color:var(--muted);font-size:12px;margin-top:6px}
@media (prefers-reduced-motion:reduce){.toast,#sheet,.float,.hint{animation:none}}
</style>

<div id="scene"></div>
<div id="top">
  <div id="topRow"><div id="res" aria-label="Recursos"></div><button id="menuBtn">Menú</button></div>
  <div id="goal"><span class="n" id="goalN">1/8</span><span class="t" id="goalT"></span></div>
</div>
<div id="toast" aria-live="polite"></div>
<div id="bottom">
  <div id="crew"></div>
  <button class="bigbtn" id="buildBtn" aria-label="Construir"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="11" height="6" rx="1.5" fill="#6a4226"/><rect x="3" y="4" width="11" height="2.5" rx="1" fill="#8a5a2e"/><rect x="11" y="9" width="3" height="12" rx="1" fill="#8a5a2e" transform="rotate(-8 12 15)"/></svg>Construir</button>
</div>
<div id="placeHint" hidden>Toca una casilla para mover · amarillo = cabe</div>
<div id="placeBar" hidden><button id="pCancel">Cancelar</button><button id="pRot">Rotar</button><button id="pOk" class="ok">Colocar</button></div>
<div id="sheet" hidden role="dialog"></div>
<div id="title">
  <div class="box">
    <h1>ISLA<br>ARCILLA</h1>
    <p class="sub">Guía a tus figuras de barro y despierta la isla.</p>
    <button class="btn main" id="tContinue">Continuar</button>
    <button class="btn" id="tNew">Nueva partida</button>
    <div class="ver">Corte vertical 0.3 · se guarda en este navegador</div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPixelatedPass} from 'three/addons/postprocessing/RenderPixelatedPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {HorizontalTiltShiftShader} from 'three/addons/shaders/HorizontalTiltShiftShader.js';
import {VerticalTiltShiftShader} from 'three/addons/shaders/VerticalTiltShiftShader.js';
import {VignetteShader} from 'three/addons/shaders/VignetteShader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

const $=id=>document.getElementById(id);

/* ================= utilities ================= */
function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967296}}
function hash(i,j,k=0){let h=Math.imul(i|0,374761393)^Math.imul(j|0,668265263)^Math.imul(k|0,982451653);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967295}
function vnoise(x,y,s,k=0){const i=Math.floor(x/s),j=Math.floor(y/s),fx=x/s-i,fy=y/s-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const a=hash(i,j,k),b=hash(i+1,j,k),c=hash(i,j+1,k),d=hash(i+1,j+1,k);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const pick=(r,a)=>a[Math.floor(r()*a.length)];

function makeCanvas(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);return c}
function pixTex(c){const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestMipmapNearestFilter;t.colorSpace=THREE.SRGBColorSpace;return t}
function px(x,X,Y,c){x.fillStyle=c;x.fillRect(X,Y,1,1)}

/* ================= ground textures ================= */
const PAL={
  grass:['#5cb847','#54ae41','#63c24d','#4ea33c'], gDark:'#3c8a32', gLight:'#8ad96b',
  dirt:['#8b5a35','#80522f','#96633c','#74482a'], dDark:'#5e3a22', dLight:'#a8764a',
  path:['#c9a36a','#bf9860','#d2ae76','#b88f58'], pDark:'#a07d4a', pLight:'#e2c28e',
  stone:['#9a948a','#c8c2b6','#6a645c'],
};
function field(x,w,h,pal,r,scale){const seed=Math.floor(r()*1e5);for(let j=0;j<h;j++)for(let i=0;i<w;i++){const n=vnoise(i,j,scale,seed);const k=r();let idx=n>.62?2:n<.36?3:0;if(k<.18)idx=1;if(k>.95)idx=(idx+2)%4;px(x,i,j,pal[idx])}}
function pebble(x,r,w,h,big){const X=Math.floor(r()*(w-3)),Y=Math.floor(r()*(h-3));const s=PAL.stone;px(x,X,Y,s[1]);px(x,X+1,Y,s[0]);px(x,X,Y+1,s[0]);px(x,X+1,Y+1,s[2]);if(big){px(x,X+2,Y,s[0]);px(x,X+2,Y+1,s[2]);px(x,X+1,Y+2,s[2]);px(x,X,Y+2,s[2])}}
function blades(x,r,n,w,h){for(let k=0;k<n;k++){const X=Math.floor(r()*w),Y=1+Math.floor(r()*(h-1));px(x,X,Y,PAL.gDark);px(x,X,Y-1,PAL.gLight)}}

const TILE_DEFS={
  pasto:{n:'Pasto',d:'Base de la isla',side:'grass',draw:(x,r,w,h)=>{field(x,w,h,PAL.grass,r,5);blades(x,r,9,w,h)}},
  matas:{n:'Pasto con matas',d:'Más denso y oscuro',side:'grass',draw:(x,r,w,h)=>{field(x,w,h,PAL.grass,r,4);for(let k=0;k<5;k++){const X=Math.floor(r()*13),Y=2+Math.floor(r()*12);for(const[a,b]of[[0,0],[1,0],[2,0],[1,-1],[0,1],[1,1],[2,1]])px(x,X+a,Y+b,PAL.gDark);px(x,X+1,Y-2,PAL.gLight);px(x,X,Y-1,PAL.gLight)}blades(x,r,6,w,h)}},
  flores:{n:'Pasto con flores',d:'Amarillas, blancas y rosadas',side:'grass',draw:(x,r,w,h)=>{field(x,w,h,PAL.grass,r,5);blades(x,r,6,w,h);for(let k=0;k<5;k++){const X=1+Math.floor(r()*13),Y=1+Math.floor(r()*13);const c=pick(r,['#fff6e0','#ff9ec4','#8ab8ff','#fff6e0']);px(x,X,Y-1,c);px(x,X-1,Y,c);px(x,X+1,Y,c);px(x,X,Y+1,c);px(x,X,Y,'#ffd84a')}}},
  trebol:{n:'Trébol',d:'Manchas claras bajas',side:'grass',draw:(x,r,w,h)=>{field(x,w,h,PAL.grass,r,6);for(let k=0;k<7;k++){const X=Math.floor(r()*14),Y=Math.floor(r()*14);px(x,X,Y,'#9be27c');px(x,X+1,Y,'#9be27c');px(x,X,Y+1,'#9be27c');px(x,X+1,Y+1,'#6fc955')}blades(x,r,4,w,h)}},
  tierra:{n:'Tierra',d:'Suelo desnudo',side:'dirt',draw:(x,r,w,h)=>{field(x,w,h,PAL.dirt,r,4);for(let k=0;k<14;k++)px(x,Math.floor(r()*w),Math.floor(r()*h),r()<.5?PAL.dDark:PAL.dLight);pebble(x,r,w,h,false)}},
  piedras:{n:'Tierra pedregosa',d:'Para la cantera',side:'dirt',draw:(x,r,w,h)=>{field(x,w,h,PAL.dirt,r,4);for(let k=0;k<10;k++)px(x,Math.floor(r()*w),Math.floor(r()*h),PAL.dDark);for(let k=0;k<4;k++)pebble(x,r,w,h,k<2)}},
  arada:{n:'Tierra arada',d:'Surcos para cultivar',side:'dirt',draw:(x,r,w,h)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++){const m=j%4;let c=m===0?PAL.dDark:m===1?'#74482a':m===2?'#8b5a35':'#a0703f';if(r()<.12)c=pick(r,PAL.dirt);px(x,i,j,c)}for(let k=0;k<3;k++){const X=1+Math.floor(r()*14),Y=2+4*Math.floor(r()*3);px(x,X,Y,'#6fc955');px(x,X,Y-1,'#9be27c')}}},
  sendero:{n:'Sendero',d:'Camino apisonado',side:'path',draw:(x,r,w,h)=>{field(x,w,h,PAL.path,r,5);for(let k=0;k<3;k++){let X=Math.floor(r()*w),Y=Math.floor(r()*h);for(let s=0;s<4;s++){px(x,X,Y,PAL.pDark);X+=r()<.5?1:0;Y+=1}}for(let k=0;k<3;k++){const X=Math.floor(r()*15),Y=Math.floor(r()*15);px(x,X,Y,PAL.pLight);px(x,X+1,Y,'#ffffff80')}}},
};
TILE_DEFS.arena={n:'Arena',d:'Playa',side:'sand',draw:(x,r,w,h)=>{field(x,w,h,['#ecd49a','#e4ca8c','#f2dcaa','#dcc084'],r,4);for(let k=0;k<10;k++)px(x,Math.floor(r()*w),Math.floor(r()*h),r()<.5?'#c8a860':'#fff0c8');if(r()<.6){const X=2+Math.floor(r()*11),Y=2+Math.floor(r()*11);px(x,X,Y,'#ff9ab8');px(x,X+1,Y,'#ffd6e2')}}};
const TILE_KEYS=Object.keys(TILE_DEFS);
const TEX={};const SWATCH={};
TILE_KEYS.forEach((k,ti)=>{TEX[k]=[0,1,2].map(v=>{const r=rng(1000+ti*97+v*13);const c=makeCanvas(16,16,(x,w,h)=>TILE_DEFS[k].draw(x,r,w,h));if(v===0)SWATCH[k]=c.toDataURL();return pixTex(c)})});
const SIDE_TEX={
  grass:pixTex(makeCanvas(16,8,(x,w,h)=>{const r=rng(55);for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(x,i,j,j>5?'#6a4226':pick(r,PAL.dirt));for(let j=0;j<h;j+=3)for(let i=0;i<w;i++)if(r()<.25)px(x,i,j,PAL.dDark);for(let i=0;i<w;i++){px(x,i,0,'#6fc955');px(x,i,1,'#56ad42');px(x,i,2,PAL.gDark);const drip=r();if(drip<.35)px(x,i,3,PAL.gDark);if(drip<.1)px(x,i,4,PAL.gDark)}})),
  dirt:pixTex(makeCanvas(16,8,(x,w,h)=>{const r=rng(77);for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(x,i,j,j===0?PAL.dLight:j>5?'#6a4226':pick(r,PAL.dirt));for(let k=0;k<8;k++)px(x,Math.floor(r()*w),1+Math.floor(r()*7),PAL.dDark);px(x,5,4,PAL.stone[0]);px(x,6,4,PAL.stone[2]);px(x,12,2,PAL.stone[0])})),
  path:pixTex(makeCanvas(16,8,(x,w,h)=>{const r=rng(88);for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(x,i,j,j<2?pick(r,PAL.path):j>5?'#6a4226':pick(r,PAL.dirt));for(let i=0;i<w;i++)if(r()<.3)px(x,i,2,PAL.pDark)})),
  under:pixTex(makeCanvas(16,8,(x,w,h)=>{const r=rng(99);for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(x,i,j,pick(r,['#7a4c2c','#6a4226','#74482a','#80522f']));for(let k=0;k<10;k++)px(x,Math.floor(r()*w),Math.floor(r()*h),PAL.dDark);for(let k=0;k<3;k++){const X=Math.floor(r()*14),Y=Math.floor(r()*7);px(x,X,Y,PAL.stone[0]);px(x,X+1,Y,PAL.stone[2])}})),
  deep:pixTex(makeCanvas(16,8,(x,w,h)=>{const r=rng(111);for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(x,i,j,pick(r,['#6b5a4c','#5e4f43','#76665a','#584a3f']));for(let k=0;k<6;k++)px(x,Math.floor(r()*w),Math.floor(r()*h),'#4e4238')})),
};

  shovel:L=>{cbox(L,0,-.12,.04,.035,.42,.035,'#8a5a2e');cbox(L,0,-.35,.07,.13,.14,.03,'#a0a8b2');cbox(L,0,.1,.04,.1,.03,.04,'#6b4a2a')},
};
function spawnCrew(id,tile){const c=makeCharacter(id);c.tool.visible=false;c.tools={};
  for(const k in TOOL_PARTS){const L=[];TOOL_PARTS[k](L);const g=new THREE.Group();g.position.set(0,-.2,0);g.rotation.x=.15;const m=part(L);m.userData.char=id;g.add(m);g.visible=false;c.arms[1].add(g);c.tools[k]=g}
  const b=new THREE.Mesh(new THREE.PlaneGeometry(.62,.62),new THREE.MeshBasicMaterial({map:blobTex,transparent:true,depthWrite:false}));b.rotation.x=-Math.PI/2;b.position.y=.012;c.root.add(b);
  c.root.position.set(tile.wx,topY(tile),tile.wz);c.dir=Math.PI/4;c.root.rotation.y=c.dir;c.job=null;c.path=[];c.toolKey='axe';c.hits=0;c.off=(crew.length%2?1:-1)*.12;c.offz=(crew.length%2?-.08:.08);
  crew.push(c);return c}
function setTool(c,kind){c.toolKey=kind==='axe'?(S.tools.hacha?'axeM':'axe'):kind==='pick'?(S.tools.pico?'pickM':'pick'):'shovel'}
function walkable(t){return !!t&&!t.tree&&!t.rock&&!t.building}
function adj(a,b){return Math.abs(a.i-b.i)+Math.abs(a.j-b.j)===1}
function bfs(start,goal){const K=t=>t.j*N+t.i;const prev=new Map([[K(start),null]]);const q=[start];
  while(q.length){const t=q.shift();if(goal(t)){const path=[];let n=t;while(n&&n!==start){path.unshift(n);n=prev.get(K(n))}return path}
    for(const[di,dj]of[[1,0],[-1,0],[0,1],[0,-1]]){const n=tileAt(t.i+di,t.j+dj);if(!walkable(n)||prev.has(K(n))||Math.abs(n.h-t.h)>1)continue;prev.set(K(n),t);q.push(n)}}
  return null}
function order(c,tile,kind,quiet){const here=tileUnder(c.root.position.x,c.root.position.z);if(!here)return false;
  let goal;if(kind==='tree'||kind==='rock')goal=t=>adj(t,tile)&&Math.abs(t.h-tile.h)<=1;else goal=t=>t===tile;
  const path=bfs(here,goal);if(!path){if(!quiet)toast('No hay camino hasta ahí');return false}
  c.job={kind,tile};c.path=path;c.hits=0;if(!path.length)arrive(c);else setAnim(c,'walk');return true}
function arrive(c){const j=c.job;if(!j||j.kind==='walk'){c.job=null;setAnim(c,'idle');return}
  const p=c.root.position;if(j.kind!=='sand')c.dir=Math.atan2(j.tile.wx-p.x,j.tile.wz-p.z);
  setTool(c,j.kind==='tree'?'axe':j.kind==='rock'?'pick':'shovel');setAnim(c,'work')}
function statusOf(c){if(c.path&&c.path.length)return 'Caminando';const j=c.job;if(!j)return 'Esperando órdenes';return j.kind==='tree'?'Talando':j.kind==='rock'?'Picando piedra':j.kind==='sand'?'Juntando arena':'Esperando'}
function nearest(c,test,max=6){const here=tileUnder(c.root.position.x,c.root.position.z);if(!here)return null;let best=null,bd=1e9;for(const t of landTiles()){if(!test(t))continue;const d=Math.abs(t.i-here.i)+Math.abs(t.j-here.j);if(d<bd&&d<=max){bd=d;best=t}}return best}
function nextTree(c){const t=nearest(c,t=>t.tree&&!t.tree.userData.falling&&!crew.some(o=>o!==c&&o.job&&o.job.tile===t));if(!t||!order(c,t,'tree',true)){c.job=null;setAnim(c,'idle')}}

function onWorkHit(c){const j=c.job;if(!j)return;c.hits++;
  if(j.kind==='tree'){const t=j.tile,g=t.tree;if(!g||g.userData.falling){nextTree(c);return}
    const u=g.userData;u.shake=1;spawnLeaf(g);spawnLeaf(g);if(Math.random()<.5)spawnLeaf(g);
    if(u.hp==null)u.hp=3+Math.round(u.s*3);u.hp--;
    if(c.hits%(S.tools.hacha?1:2)===0)gain('madera',1,c);
    if(u.hp<=0){u.falling=.001;u.fallDir=Math.atan2(g.position.x-c.root.position.x,g.position.z-c.root.position.z);u.regrow=c.id==='musgo'?12:40;u.feller=c;setTimeout(()=>{if(c.job&&c.job.tile===t)nextTree(c)},450)}}
  else if(j.kind==='rock'){const m=j.tile.rock;if(m)m.userData.shake=1;if(c.hits%2===0){gain('piedra',1,c);if(Math.random()<(S.tools.pico?.65:.35))gain('mineral',1,c,.35)}}
  else if(j.kind==='sand'){const p=c.root.position;puff(p.x+Math.sin(c.root.rotation.y)*.35,p.y+.06,p.z+Math.cos(c.root.rotation.y)*.35,'#f0d890',6,1.6,1.2);P.slice(-6).forEach(q=>q.floor=p.y);if(c.hits%2===0)gain('arena',1,c)}}

const regrowQ=[];
function tickTrees(dt,T){for(const g of trees.slice()){const u=g.userData;
    u.shake=Math.max(0,(u.shake||0)-dt*2.6);
    u.canopy.rotation.z=Math.sin(T*1.3+u.ph)*.03/u.s+Math.sin(T*38)*u.shake*.07;u.canopy.rotation.x=Math.cos(T*1.05+u.ph*1.3)*.022/u.s+Math.cos(T*33)*u.shake*.05;
    if(u.grow!=null&&u.grow<1){u.grow=Math.min(1,u.grow+dt*.7);const k=1-Math.pow(1-u.grow,3);g.scale.setScalar(u.sc*Math.max(.05,k))}
    if(u.falling){u.falling=Math.min(1,u.falling+dt*1.5);const k=u.falling*u.falling;g.rotation.x=Math.cos(u.fallDir)*k*1.45;g.rotation.z=-Math.sin(u.fallDir)*k*1.45;
      if(u.falling>=1){const t=u.tile;const p=g.position;for(let a=0;a<3;a++)puff(p.x+Math.sin(u.fallDir)*(.4+a*.35),p.y+.1,p.z+Math.cos(u.fallDir)*(.4+a*.35),a%2?'#6fc955':'#c9a06a',6,1.4,1.6);P.slice(-18).forEach(q=>q.floor=p.y);
        regrowQ.push({t,type:u.type,at:T+u.regrow});removeTree(t)}}}
  for(let k=regrowQ.length-1;k>=0;k--){const q=regrowQ[k];if(T<q.at)continue;const t=q.t;if(t.tree||t.building||t.rock||crew.some(c=>tileUnder(c.root.position.x,c.root.position.z)===t)){q.at=T+5;continue}
    regrowQ.splice(k,1);addTree(t,q.type,1);const g=t.tree;g.userData.grow=0;g.scale.setScalar(.05);puff(t.wx,topY(t)+.05,t.wz,'#8ad96b',8,1.2,1)}
  for(const m of rocks){const u=m.userData;u.shake=Math.max(0,(u.shake||0)-dt*4);const s=1+Math.sin(T*50)*u.shake*.025;m.scale.set(s,1-u.shake*.03,s)}}

/* ================= buildings ================= */
const buildings=[];
function fpTiles(type,i,j,rot){const[w0,d0]=BDEF[type].size;const[w,d]=rot%2?[d0,w0]:[w0,d0];const a=[];for(let dj=0;dj<d;dj++)for(let di=0;di<w;di++)a.push(tileAt(i+di,j+dj));return a}
function fpValid(tiles){if(tiles.some(t=>!t))return false;const h=tiles[0].h;return tiles.every(t=>t.h===h&&!t.tree&&!t.rock&&!t.building&&!crew.some(c=>tileUnder(c.root.position.x,c.root.position.z)===t&&c.job&&c.job.kind==='sand'&&c.job.tile===t))}
function fpCenter(tiles){let x=0,z=0;tiles.forEach(t=>{x+=t.wx;z+=t.wz});return[x/tiles.length,topY(tiles[0]),z/tiles.length]}
function createBuilding(type,i,j,rot,animate,extra={}){const tiles=fpTiles(type,i,j,rot);if(tiles.some(t=>!t))return null;
  tiles.forEach(t=>{removeTree(t);if(t.rock){worldGroup.remove(t.rock);rocks.splice(rocks.indexOf(t.rock),1);t.rock=null}});
  const mdl=BDEF[type].model();const g=mdl.group;const[cx,cy,cz]=fpCenter(tiles);g.position.set(cx,cy,cz);g.rotation.y=rot*Math.PI/2;
  const b={type,i,j,rot,tiles,group:g,glow:mdl.glow,smoke:mdl.smoke,queue:extra.queue||0,prog:extra.prog||0,build:animate?0:1};
  g.traverse(o=>{if(o.isMesh)o.userData.building=b});tiles.forEach(t=>t.building=b);worldGroup.add(g);buildings.push(b);
  // crew standing inside the footprint steps out
  crew.forEach(c=>{if(tiles.includes(tileUnder(c.root.position.x,c.root.position.z))){const out=bfs(tiles[0],t=>walkable(t));if(out&&out.length){const d=out[out.length-1];c.root.position.set(d.wx,topY(d),d.wz)}}});
  if(animate){g.scale.set(1,.02,1);for(const t of tiles)puff(t.wx,topY(t)+.1,t.wz,'#d8c8a8',8,1.6,1.8)}
  rebuildDeco();return b}
function smokeWorld(b){const v=new THREE.Vector3(...b.smoke);b.group.localToWorld(v);return v}
function tickBuildings(dt,T){for(const b of buildings){
  if(b.build<1){b.build=Math.min(1,b.build+dt*1.4);const k=b.build;const e=1+2.2*Math.pow(k-1,3)+1.2*Math.pow(k-1,2);b.group.scale.set(1,Math.max(.02,e),1);if(b.build>=1)b.group.scale.set(1,1,1)}
  if(b.type==='horno'){const on=b.queue>0;
    if(on){b.prog+=dt/8;if(b.prog>=1){b.prog=0;b.queue--;S.res.lingote++;S.got.lingote++;S.made++;bump('lingote');checkGoals();const v=smokeWorld(b);floatAt(v,'+1',ICON.lingote);puff(v.x,v.y,v.z,'#ffd04a',10,2.2,1.4);refreshUI();save()}}
    const f=on?(1.6+.5*Math.sin(T*9)+.3*Math.sin(T*23)):.18;b.glow.material.color.setRGB(2.4*f,.9*f,.22*f);
    if(on&&Math.random()<dt*6){const v=smokeWorld(b);P.push({x:v.x,y:v.y,z:v.z,vx:(Math.random()-.5)*.25,vy:.5+Math.random()*.3,vz:(Math.random()-.5)*.25,life:1.6,s:.07+Math.random()*.05,c:new THREE.Color(Math.random()<.5?'#c8c4be':'#a8a49e'),g:-.2,floor:-9})}}
  if(b.type==='casa'&&Math.random()<dt*1.2){const v=smokeWorld(b);P.push({x:v.x,y:v.y,z:v.z,vx:(Math.random()-.5)*.15,vy:.35,vz:(Math.random()-.5)*.15,life:1.8,s:.05+Math.random()*.04,c:new THREE.Color('#d8d4ce'),g:-.1,floor:-9})}}}

let place=null;
const fpGroup=new THREE.Group();scene.add(fpGroup);
const FP_OK=new THREE.MeshBasicMaterial({color:'#f2c14e',transparent:true,opacity:.5,depthWrite:false}),FP_BAD=new THREE.MeshBasicMaterial({color:'#ff5a4a',transparent:true,opacity:.5,depthWrite:false});
const FP_EDGE_OK=new THREE.LineBasicMaterial({color:'#fff0b0'}),FP_EDGE_BAD=new THREE.LineBasicMaterial({color:'#ffc0b0'});
const fpPlaneGeo=new THREE.PlaneGeometry(.94,.94);fpPlaneGeo.rotateX(-Math.PI/2);const fpEdgeGeo=new THREE.EdgesGeometry(new THREE.BoxGeometry(.98,.04,.98));

function startPlace(type){closeSheet();selected=null;const c=screenCenterTile()||tileAt(N/2,N/2);const ghost=BDEF[type].model().group;ghost.traverse(o=>{if(o.isMesh){o.material=GHOST_MAT;o.castShadow=false}});scene.add(ghost);

function screenCenterTile(){ray.setFromCamera(new THREE.Vector2(0,-.1),camera);const h=ray.intersectObjects(tileMeshes,false)[0];return h?h.object.userData.tile:null}
function updatePlace(){if(!place)return;while(fpGroup.children.length)fpGroup.remove(fpGroup.children[0]);
  const tiles=fpTiles(place.type,place.i,place.j,place.rot);place.valid=fpValid(tiles);
  for(const t of tiles){if(!t)continue;const y=topY(t)+.025;const m=new THREE.Mesh(fpPlaneGeo,place.valid?FP_OK:FP_BAD);m.position.set(t.wx,y,t.wz);m.renderOrder=5;fpGroup.add(m);const e=new THREE.LineSegments(fpEdgeGeo,place.valid?FP_EDGE_OK:FP_EDGE_BAD);e.position.set(t.wx,y,t.wz);fpGroup.add(e)}
  const real=tiles.filter(Boolean);if(real.length){const[cx,cy,cz]=fpCenter(real);place.ghost.position.set(cx,cy+.02,cz)}place.ghost.rotation.y=place.rot*Math.PI/2;
  $('pOk').disabled=!place.valid}
function endPlace(){if(!place)return;scene.remove(place.ghost);while(fpGroup.children.length)fpGroup.remove(fpGroup.children[0]);place=null;$('bottom').hidden=false;$('placeBar').hidden=true;$('placeHint').hidden=true;refreshUI()}
$('pCancel').onclick=endPlace;
$('pRot').onclick=()=>{if(place){place.rot=(place.rot+1)%4;updatePlace()}};
$('pOk').onclick=()=>{if(!place||!place.valid)return;const d=BDEF[place.type];if(!afford(d.cost)){toast('Te faltan materiales');return}pay(d.cost);
  const b=createBuilding(place.type,place.i,place.j,place.rot,true);const type=place.type;endPlace();toast(`${d.n} construida`);

  checkGoals();refreshUI();save()};
function joinMusgo(b){S.crew.push('musgo');const out=bfs(b.tiles[0],t=>walkable(t)&&!b.tiles.includes(t))||[];const t=out.length?out[out.length-1]:landTiles().find(walkable);const c=spawnCrew('musgo',t);setAnim(c,'wave');c.roam=false;puff(t.wx,topY(t)+.2,t.wz,'#8ad96b',12,1.8,1.4);

/* ================= economy ================= */
function afford(c){return Object.entries(c).every(([k,v])=>S.res[k]>=v)}
function pay(c){for(const[k,v]of Object.entries(c))S.res[k]-=v;refreshUI()}
const bumps={};function bump(k){bumps[k]=.5}
const _pv=new THREE.Vector3();
function floatAt(v,txt,icon){_pv.copy(v).project(camera);if(_pv.z>1)return;const x=(_pv.x+1)/2*innerWidth,y=(1-_pv.y)/2*innerHeight;const el=document.createElement('div');el.className='float';el.style.left=x+'px';el.style.top=y+'px';el.innerHTML=`${icon?`<img src="${icon}" alt="">`:''}${txt}`;document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove())}
function gain(k,n,c,dy=0){S.res[k]+=n;S.got[k]+=n;bump(k);if(c){const v=c.root.position.clone();v.y+=1+dy;floatAt(v,'+'+n,ICON[k])}checkGoals();refreshUI()}
const TOOLS={
  hacha:{n:'Hacha de metal',d:'Cada golpe al árbol da madera: el doble de rápido.',cost:{lingote:2,madera:3}},

function checkGoals(){let changed=false;while(S.goal<GOALS.length&&GOALS[S.goal].ok()){S.goal++;changed=true;$('goal').classList.add('flash');setTimeout(()=>$('goal').classList.remove('flash'),700)}

    ${b.queue?`<div class="bar"><i id="hbar" style="width:${Math.round(b.prog*100)}%"></i></div><small>En el horno: ${b.queue}</small>`:''}</div><button class="btn${afford(RECIPE.cost)?' main':''}" data-act="smelt" ${afford(RECIPE.cost)&&b.queue<5?'':'disabled'}>Fundir</button></div>
    ${S.res.mineral<2?'<p>El mineral sale al picar las rocas grises con vetas azules.</p>':''}`}
  else if(t==='menu'){h+=`<h2>Menú</h2><p>La partida se guarda sola en este navegador.</p>
    <div class="row"><div class="info"><b>Calidad gráfica</b><small>Baja apaga la sombra de contacto y el desenfoque: más fluido en celulares.</small></div><button class="btn" data-act="quality">${quality==='alta'?'Alta':'Baja'}</button></div>
    <div class="row"><div class="info"><b>Nueva partida</b><small>Borra el progreso y empieza de cero.</small></div>${confirmReset?'<button class="btn main" data-act="reset2">Sí, borrar</button>':'<button class="btn" data-act="reset">Empezar de cero</button>'}</div>`}
  else if(t==='fin'){const m=Math.max(1,Math.round(S.time/60));h+=`<h2>¡Corte vertical completo!</h2><p>Talaste, construiste, fundiste metal y mejoraste a tu equipo en ${m===1?'un minuto':`unos ${m} minutos`}. Esta es la base del bucle: asignar, producir, procesar, construir y descubrir.</p>
    <p>Lo que viene en la siguiente versión: expansión de tierra, la cueva del volcán y el primer secreto con Brasa.</p><button class="btn main" data-act="close" style="width:100%">Seguir jugando</button>`}
  $('sheet').innerHTML=h}
$('sheet').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.act==='close')return closeSheet();
  if(b.dataset.place)return startPlace(b.dataset.place);
  if(b.dataset.tool){const d=TOOLS[b.dataset.tool];if(!afford(d.cost))return;pay(d.cost);S.tools[b.dataset.tool]=true;toast(`Fabricaste: ${d.n}`);crew.forEach(c=>{if(c.job)setTool(c,c.job.kind==='tree'?'axe':c.job.kind==='rock'?'pick':'shovel')});const cb=buildings.find(x=>x.type==='casa');if(cb){const v=smokeWorld(cb);puff(v.x,v.y-1,v.z,'#fff0b0',12,2,1.6)}checkGoals();save();return renderSheet()}
  if(b.dataset.act==='smelt'){const hb=sheetArg;if(!afford(RECIPE.cost)||hb.queue>=5)return;pay(RECIPE.cost);hb.queue++;save();return renderSheet()}
  if(b.dataset.act==='quality'){setQuality(quality==='alta'?'baja':'alta');return renderSheet()}
  if(b.dataset.act==='reset'){confirmReset=true;return renderSheet()}
  if(b.dataset.act==='reset2'){try{localStorage.removeItem(KEY)}catch(e){}newGame();closeSheet();return}});

let quality=IS_TOUCH?'baja':'alta';
function setQuality(q){quality=q;aoPass.enabled=q==='alta';tiltH.enabled=tiltV.enabled=q==='alta';sun.shadow.mapSize.set(q==='alta'?2048:1024,q==='alta'?2048:1024);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}try{localStorage.setItem(KEY+'-q',q)}catch(e){}}

/* ================= input ================= */
const ray=new THREE.Raycaster();const ndc=new THREE.Vector2();
function setNDC(x,y){const r=renderer.domElement.getBoundingClientRect();ndc.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera)}
const marker=new THREE.Mesh(new THREE.RingGeometry(.3,.4,28),new THREE.MeshBasicMaterial({color:'#f2c14e',transparent:true,side:THREE.DoubleSide,depthWrite:false}));marker.rotation.x=-Math.PI/2;marker.visible=false;scene.add(marker);let markerT=0;
function showMarker(t){marker.position.set(t.wx,topY(t)+.03,t.wz);marker.visible=true;markerT=1}
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;down={x:e.clientX,y:e.clientY,t:performance.now(),multi:false}});
renderer.domElement.addEventListener('pointerdown',e=>{if(!e.isPrimary&&down)down.multi=true});
renderer.domElement.addEventListener('pointerup',e=>{if(!e.isPrimary||!down)return;const d=down;down=null;if(d.multi||Math.hypot(e.clientX-d.x,e.clientY-d.y)>10||performance.now()-d.t>500)return;onTap(e.clientX,e.clientY)});
function pickObj(){const hits=[];
  const ch=ray.intersectObjects(crew.map(c=>c.root),true)[0];if(ch)hits.push({d:ch.distance-.3,kind:'char',id:ch.object.userData.char});
  const bh=ray.intersectObjects(buildings.map(b=>b.group),true)[0];if(bh)hits.push({d:bh.distance,kind:'building',b:bh.object.userData.building});
  const th=ray.intersectObjects(trees,true)[0];if(th){let o=th.object;while(o&&!o.userData.tile)o=o.parent;if(o&&!o.userData.falling)hits.push({d:th.distance,kind:'tree',tile:o.userData.tile})}
  const rh=ray.intersectObjects(rocks,false)[0];if(rh)hits.push({d:rh.distance,kind:'rock',tile:rh.object.userData.tile});
  const gh=ray.intersectObjects(tileMeshes,false)[0];if(gh)hits.push({d:gh.distance+.05,kind:'tile',tile:gh.object.userData.tile});
  hits.sort((a,b)=>a.d-b.d);return hits[0]||null}
function onTap(x,y){scene.updateMatrixWorld();setNDC(x,y);const h=place?null:pickObj();
  if(place){const gh=ray.intersectObjects(tileMeshes,false)[0];const t=gh?gh.object.userData.tile:(h&&(h.tile||(h.b&&h.b.tiles[0])));if(!t)return;place.i=t.i;place.j=t.j;updatePlace();return}
  if(!$('sheet').hidden){closeSheet();return}
  if(!h){selected=null;refreshUI();return}
  if(h.kind==='char'){selected=selected===h.id?null:h.id;refreshUI();return}
  if(h.kind==='building'){if(h.b.build<1)return;selected=null;openSheet(h.b.type,h.b);return}
  const c=selected&&crew.find(c=>c.id===selected);
  const kind=h.kind==='tree'?'tree':h.kind==='rock'?'rock':h.tile.type==='arena'?'sand':'walk';
  if(!c){if(kind!=='walk')toast(crew.length>1?'Primero toca a una figura':'Primero toca a Arci');return}
  if(kind==='tree'&&crew.some(o=>o!==c&&o.job&&o.job.tile===h.tile)){toast('Otra figura ya trabaja ese árbol');return}
  if(order(c,h.tile,kind)){showMarker(h.tile);selected=null;refreshUI()}}

/* ================= character update ================= */
function updateChar(c,dt,T){c.t+=dt;const p=c.root.position;
  if(c.path&&c.path.length){const t=c.path[0];const tx=t.wx+c.off,tz=t.wz+c.offz;const dx=tx-p.x,dz=tz-p.z;const d=Math.hypot(dx,dz);const sp=1.55*dt;
    if(d<=sp){p.x=tx;p.z=tz;c.path.shift();if(!c.path.length)arrive(c)}else{p.x+=dx/d*sp;p.z+=dz/d*sp;c.dir=Math.atan2(dx,dz);if(c.anim!=='walk')setAnim(c,'walk')}}
  const u=tileUnder(p.x,p.z);if(u)p.y=lerp(p.y,topY(u),Math.min(1,dt*12));
  c.root.rotation.y=angleLerp(c.root.rotation.y,c.dir,Math.min(1,dt*9));
  c.blink-=dt;const bl=c.blink<0?Math.max(.1,Math.abs(c.blink+.07)/.07):1;if(c.blink<-.14)c.blink=2+Math.random()*4;c.eyes.forEach(e=>e.scale.y=bl);
  const [L,R]=[c.arms[0],c.arms[1]];const[hl,hr]=[c.hips[0],c.hips[1]];
  let sy=1,sxz=1,bob=0,lean=0,hx=0,hz=0;
  L.rotation.set(0,0,0);R.rotation.set(0,0,0);hl.rotation.set(0,0,0);hr.rotation.set(0,0,0);c.head.rotation.set(0,0,0);
  for(const k in c.tools)c.tools[k].visible=c.anim==='work'&&k===c.toolKey;
  if(c.anim==='idle'){const b=Math.sin(T*2.3+c.phase);sy=1+.035*b;sxz=1-.018*b;L.rotation.z=.12+.04*b;R.rotation.z=-.12-.04*b;hz=Math.sin(T*.7+c.phase)*.12;hx=Math.sin(T*.5+c.phase)*.05}
  else if(c.anim==='walk'){const ph=c.t*10.5;const s=Math.sin(ph);hl.rotation.x=-s*.65;hr.rotation.x=s*.65;L.rotation.x=s*.55;R.rotation.x=-s*.55;L.rotation.z=.18;R.rotation.z=-.18;const contact=1-Math.abs(s);bob=Math.abs(s)*.045;sy=1-.07*contact;sxz=1+.035*contact;lean=.08;hz=Math.sin(ph*.5)*.06;
    const step=Math.floor(ph/Math.PI);if(step!==c.lastStep){c.lastStep=step;if(Math.random()<.4){puff(p.x,p.y+.03,p.z,'#d8c8a8',2,.6,.6);P.slice(-2).forEach(q=>q.floor=p.y)}}}
  else if(c.anim==='work'){const cyc=1.15;const q=(c.t%cyc)/cyc;let a;
    if(q<.55){const k=smoothstep(0,.55,q);a=lerp(0,-2.85,k);sy=1+.07*k;sxz=1-.035*k;lean=-.12*k;hx=-.15*k}
    else if(q<.66){const k=smoothstep(.55,.66,q);a=lerp(-2.85,-.75,k);lean=lerp(-.12,.2,k);sy=lerp(1.07,.86,k);sxz=lerp(.965,1.09,k);hx=lerp(-.15,.12,k)}
    else{const k=smoothstep(.66,1,q);a=lerp(-.75,0,k);lean=lerp(.2,0,k);sy=lerp(.86,1,k);sxz=lerp(1.09,1,k);hx=lerp(.12,0,k)}
    R.rotation.x=a;L.rotation.x=a*.55;L.rotation.z=.15;R.rotation.z=-.08;
    if(q>=.66&&!c.workHit){c.workHit=true;const r=c.root;const fx=p.x+Math.sin(r.rotation.y)*.4,fz=p.z+Math.cos(r.rotation.y)*.4;const j=c.job;
      const col=j&&j.kind==='rock'?'#b8b2a8':j&&j.kind==='tree'?'#c9a06a':'#d8c8a8';if(!j||j.kind!=='sand'){puff(fx,p.y+.25,fz,col,6,1.8,1.4);P.slice(-6).forEach(q=>q.floor=p.y)}
      onWorkHit(c)}
    if(q<.3)c.workHit=false}
  else if(c.anim==='wave'){const w=Math.sin(c.t*11);R.rotation.z=-2.55+w*.35;L.rotation.z=.15;sy=1+.03*Math.sin(c.t*5.5);hz=-.12+w*.04;bob=Math.max(0,Math.sin(c.t*5.5))*.03}
  c.body.scale.set(sxz,sy,sxz);c.body.position.y=bob;c.body.rotation.x=lean;c.head.rotation.x=hx;c.head.rotation.z=hz;
  c.ring.visible=selected===c.id;if(c.ring.visible){const s=1+Math.sin(T*6)*.08;c.ring.scale.set(s,s,s)}}

/* ================= camera / resize ================= */
function resize(){const w=innerWidth,h=innerHeight;aspect=w/h;camera.left=-FR*aspect;camera.right=FR*aspect;camera.top=FR;camera.bottom=-FR;camera.clearViewOffset();camera.updateProjectionMatrix();renderer.setSize(w,h);composer.setSize(w,h);updateTilt()}
function updateTilt(){const w=innerWidth,h=innerHeight;tiltH.uniforms.h.value=4*tiltAmt/w;tiltV.uniforms.v.value=4*tiltAmt/h;tiltH.uniforms.r.value=.5;tiltV.uniforms.r.value=.5}
addEventListener('resize',resize);
function clampCam(){const t=controls.target;const lim=N/2-1;const cx=Math.max(-lim,Math.min(lim,t.x)),cz=Math.max(-lim,Math.min(lim,t.z));if(cx!==t.x||cz!==t.z){const dx=cx-t.x,dz=cz-t.z;t.x=cx;t.z=cz;camera.position.x+=dx;camera.position.z+=dz}}

/* ================= boot ================= */
function newGame(fromSave){
  for(const c of crew)scene.remove(c.root);crew.length=0;buildings.length=0;regrowQ.length=0;selected=null;endPlace();
  S=fromSave||freshState();
  buildIsland(4242);placeRocks(4242);rebuildDeco();
  for(const bs of S.buildings||[])createBuilding(bs.type,bs.i,bs.j,bs.rot,false,bs);
  const c0=tileAt(Math.floor(N/2),Math.floor(N/2))||landTiles()[0];const good=t=>walkable(t)&&t.type!=='arena'&&t.h===1&&[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>walkable(tileAt(t.i+a,t.j+b))).length>=3;const start=bfs(c0,good);const st=start===null?landTiles().find(walkable):start.length?start[start.length-1]:c0;
  const pos=[st];for(const id of S.crew){const t=pos.length>1?(bfs(st,x=>walkable(x)&&!pos.includes(x))||[]).pop()||st:st;pos.push(t);spawnCrew(id,t)}
  controls.target.set(st.wx,.5,st.wz);camera.position.set(st.wx+18,17.5,st.wz+18);camera.zoom=innerWidth<innerHeight?.8:1.35;camera.updateProjectionMatrix();controls.update();placeSun();
  refreshUI()}
$('tContinue').onclick=()=>{startGame(loadSave())};
$('tNew').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}startGame(null)};
function startGame(s){newGame(s||null);$('title').hidden=true;running=true;save()}
let running=false;
try{const q=localStorage.getItem(KEY+'-q');if(q)quality=q}catch(e){}
setQuality(quality);
$('tContinue').hidden=!hasSave();
resize();applyTime('manana');newGame(loadSave());
const clock=new THREE.Clock();let T=0,saveAcc=0,uiAcc=0;
function loop(){const rdt=clock.getDelta();const dt=Math.min(.05,rdt);T+=dt;
  if(running){S.time+=dt;saveAcc+=dt;if(saveAcc>6){saveAcc=0;save()}}
  for(const c of crew)updateChar(c,dt,T);
  tickTrees(dt,T);tickBuildings(dt,T);tickParticles(dt);tickLeaves(dt,T);
  for(const k in bumps)bumps[k]-=dt;uiAcc+=dt;if(uiAcc>.3){uiAcc=0;refreshUI();if(sheetType==='horno'&&$('hbar'))$('hbar').style.width=Math.round(sheetArg.prog*100)+'%'}
  if(markerT>0){markerT-=dt*1.2;marker.material.opacity=Math.max(0,markerT);const s=1+(1-markerT)*.4;marker.scale.set(s,s,s);if(markerT<=0)marker.visible=false}
  waterTex.offset.x=(T*.012)%1;waterTex.offset.y=Math.sin(T*.4)*.01;
  controls.update();clampCam();composer.render();requestAnimationFrame(loop)}
loop();

</script>
